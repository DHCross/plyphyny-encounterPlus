<!doctype html>
<html lang="en" {{HTML_CLASS}}>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
        <link href="./assets/css/global.css" rel="stylesheet" type="text/css">
        <link href="./assets/css/custom.css" rel="stylesheet" type="text/css">
    </head>
    <script>
        window.data = {{HTML_DATA}};
    </script>
    <body>
        <div id="page">
            {{HTML_BODY}}
        </div>
    </body>
    <script src="./assets/js/custom.js"></script>
    <script>
        function callback(e) {
            // event check
            if (!e) {
                return
            }

            // img handler
            if (e.target.tagName === 'IMG') {
                var src = e.target.getAttribute('src');
                if (src.startsWith("http")) {
                    window.location.href = src;
                    return;
                } else {
                    window.location.href = "https://encounter.plus/" + src;
                    return;
                }
            }
            
            // anchor handler
            var target = e.target.closest('a') || e.target;
            if (target.tagName === 'A') {
                var link = target.getAttribute('href');

                if (link === '/roll' || link === '/r') {
                    e.preventDefault();
                    var href = "https://encounter.plus/roll/" + encodeURIComponent(target.text);
                    if (target.hasAttribute('title')) {
                        href = href + "/" + encodeURIComponent(target.getAttribute('title'));
                    }
                    window.location.href = href;
                    return;
                }
                
                if (link.startsWith("/")) {
                    e.preventDefault();
                    window.location.href = "https://encounter.plus" + link;
                    return;
                }
                return
            }
            return;
        };
    
        // add global event listener
        if (document.addEventListener) {
            document.addEventListener('click', callback, false);
        } else {
            document.attachEvent('onclick', callback);
        }
    </script>
</html>
